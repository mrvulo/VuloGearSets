name: Release

# Laeuft, sobald ein Versions-Tag geschoben wird:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  # Probelauf: Actions -> Release -> Run workflow. Baut nur das Paket,
  # laedt nichts hoch (siehe -d weiter unten).
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          # Der Packager braucht die volle Historie fuer den Changelog
          # zwischen zwei Tags.
          fetch-depth: 0

      # Zwei getrennte Schritte statt eines Ausdrucks fuer args: ein leerer
      # String gilt in GitHub-Ausdruecken als falsch, weshalb sich "keine
      # Argumente" dort nicht sauber ausdruecken laesst.

      - name: Paket bauen und veroeffentlichen
        if: github.ref_type == 'tag'
        uses: BigWigsMods/packager@master
        env:
          GITHUB_OAUTH:    ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY:      ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN:  ${{ secrets.WAGO_API_TOKEN }}

      - name: Paket nur bauen (Probelauf)
        if: github.ref_type != 'tag'
        uses: BigWigsMods/packager@master
        with:
          args: -d   # bauen, nicht hochladen
        env:
          GITHUB_OAUTH:    ${{ secrets.GITHUB_TOKEN }}

      # Beim Probelauf das gebaute Paket mitgeben, damit sich der Inhalt
      # pruefen laesst. Der Packager selbst legt kein Artefakt an.
      - name: Paket als Artefakt anhaengen
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: VuloGearSets-probelauf
          path: .release/*.zip
          if-no-files-found: warn
