name: Release

# Laeuft, sobald ein Versions-Tag geschoben wird:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  # Probelauf: Actions -> Release -> Run workflow. Baut nur das Paket,
  # laedt nichts hoch (siehe -d weiter unten).
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5
        with:
          # Der Packager braucht die volle Historie fuer den Changelog
          # zwischen zwei Tags.
          fetch-depth: 0

      - name: Paket bauen und veroeffentlichen
        uses: BigWigsMods/packager@master
        with:
          # Ohne Tag baut der Packager eine Alpha und laedt sie hoch, sobald
          # Tokens da sind. Beim manuellen Lauf deshalb -d setzen: bauen,
          # aber nicht veroeffentlichen. Nur ein Tag loest einen echten
          # Release aus.
          args: ${{ github.ref_type == 'tag' && ' ' || '-d' }}
        env:
          GITHUB_OAUTH:    ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY:      ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN:  ${{ secrets.WAGO_API_TOKEN }}

      # Beim Probelauf das gebaute Paket mitgeben, damit sich der Inhalt
      # pruefen laesst. Der Packager selbst legt kein Artefakt an.
      - name: Paket als Artefakt anhaengen
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: VuloGearSets-probelauf
          path: .release/*.zip
          if-no-files-found: warn
